<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="60%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#06080d"/>
    </radialGradient>

    <!-- Luxury Gold Gradient Primary -->
    <linearGradient id="goldGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9"/>
      <stop offset="25%" stop-color="#DFB76C"/>
      <stop offset="60%" stop-color="#C28E34"/>
      <stop offset="85%" stop-color="#9E6B1F"/>
      <stop offset="100%" stop-color="#E5C178"/>
    </linearGradient>

    <!-- Bright Gold Accent -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Atelier Badge Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Luxury Outer Gold Crest Ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#goldGradPrimary)" stroke-width="6" opacity="0.85"/>
  <rect x="36" y="36" width="440" height="440" rx="98" fill="none" stroke="url(#goldGradPrimary)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Top Imperial Atelier Star Accents -->
  <g transform="translate(256, 105)" fill="url(#goldBright)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" />
    <polygon points="-36,-3 -33,0 -30,1 -33,2 -36,5 -37,2 -40,1 -37,0" transform="scale(0.8) translate(-10, -5)" opacity="0.8"/>
    <polygon points="36,-3 39,0 42,1 39,2 36,5 35,2 32,1 35,0" transform="scale(0.8) translate(10, -5)" opacity="0.8"/>
  </g>

  <!-- Central Emblem: Stylized Luxury Sneaker Silhouette + S-Monogram Wings -->
  <g filter="url(#goldGlow)">
    <path d="M 120 345 
             C 150 355, 210 360, 270 350 
             C 320 342, 360 325, 395 305 
             C 405 300, 412 308, 405 318 
             C 380 350, 325 382, 255 385 
             C 185 388, 130 372, 105 356 
             C 98 351, 105 340, 120 345 Z" 
          fill="url(#goldGradPrimary)"/>

    <path d="M 135 320 
             C 180 328, 235 328, 275 305 
             C 315 282, 335 250, 360 215 
             C 370 200, 385 190, 400 185 
             C 408 182, 405 195, 392 205 
             C 365 228, 345 265, 310 295 
             C 265 332, 190 345, 130 332 
             C 120 330, 122 318, 135 320 Z" 
          fill="url(#goldBright)"/>

    <path d="M 215 165 
             C 235 155, 270 155, 290 185 
             C 305 210, 310 238, 300 260 
             C 295 272, 282 272, 285 258 
             C 292 238, 290 215, 275 198 
             C 260 180, 235 178, 210 188 
             C 170 205, 150 250, 175 285 
             C 185 298, 205 305, 225 308 
             C 235 309, 232 318, 220 316 
             C 192 312, 168 300, 155 280 
             C 130 238, 160 188, 215 165 Z" 
          fill="url(#goldGradPrimary)"/>

    <circle cx="230" cy="190" r="5" fill="#FBF0B9" />
    <circle cx="252" cy="210" r="5" fill="#FBF0B9" />
    <circle cx="272" cy="232" r="5" fill="#FBF0B9" />
  </g>

  <text x="256" y="435" 
        font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" 
        font-size="34" 
        font-weight="700" 
        letter-spacing="10" 
        fill="url(#goldBright)" 
        text-anchor="middle">
    STOKKITA
  </text>
  
  <text x="256" y="458" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="6" 
        fill="#DFB76C" 
        opacity="0.8"
        text-anchor="middle">
    HAUTE ATELIER
  </text>
</svg>
